name: CI

# Проверки фазы 9 (§15): типы, линтер, юнит и property, сборка с гейтом бюджета, золотая сумма математики, побайтная
# пересборка книги и полный e2e в Chromium и WebKit. Замеры (`npm run measure`) и снимки (`npm run shots`) здесь не идут:
# им нужен настоящий GPU. Без GPU WebGPU нет — e2e проверяет откат на WebGL (fallback.spec).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run math:quick
      - run: npm run book:check
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --trace retain-on-failure
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
